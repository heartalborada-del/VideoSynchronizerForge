name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.classifier }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-aarch64
            classifier: linux-arm64
          - platform: linux-x86_64
            classifier: linux-amd64
          - platform: windows-aarch64
            classifier: windows-arm64
          - platform: windows-x86_64
            classifier: windows-amd64
          - platform: none
            classifier: no-ffmpeg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.8"

      - name: Build release JAR
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          FFMPEG_PLATFORM: ${{ matrix.platform }}
          CLASSIFIER: ${{ matrix.classifier }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gradle build --no-daemon --stacktrace \
            -Pmod_version="$version" \
            -PembeddedFfmpegPlatform="$FFMPEG_PLATFORM"

          artifact="build/libs/video_synchronizer-${version}-${CLASSIFIER}.jar"
          test -f "$artifact"
          mkdir -p release-artifact
          cp "$artifact" release-artifact/

      - name: Upload release JAR
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.classifier }}
          path: release-artifact/*.jar
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release JARs
        uses: actions/download-artifact@v8
        with:
          pattern: jar-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify artifacts and write checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find release-artifacts -maxdepth 1 -type f -name '*.jar' | sort)
          test "${#jars[@]}" -eq 5
          (
            cd release-artifacts
            sha256sum ./*.jar > SHA256SUMS
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Video Synchronizer ${{ github.ref_name }}
          body_path: .github/release-template.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.jar
            release-artifacts/SHA256SUMS
