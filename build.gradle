buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath 'org.apache.commons:commons-compress:1.27.1'
        classpath 'org.tukaani:xz:1.10'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

def embeddedFfmpegPlatformProperty = providers.gradleProperty('embeddedFfmpegPlatform')
def embeddedFfmpegPlatform = embeddedFfmpegPlatformProperty.getOrElse('windows-x86_64')
def embeddedFfmpegClassifiers = [
        'linux-aarch64' : 'linux-arm64',
        'linux-x86_64'  : 'linux-amd64',
        'windows-aarch64': 'windows-arm64',
        'windows-x86_64': 'windows-amd64',
        'none'          : 'no-ffmpeg'
]
if (!embeddedFfmpegClassifiers.containsKey(embeddedFfmpegPlatform)) {
    throw new GradleException("Unsupported embeddedFfmpegPlatform '${embeddedFfmpegPlatform}'. " +
            "Expected one of: ${embeddedFfmpegClassifiers.keySet().join(', ')}")
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

def ffmpegReleaseTag = 'latest'
def ffmpegReleaseApi =
        'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest'
def ffmpegBuildSeries = 'n8.1'
def embeddedFfmpegBundles = [
        'linux-aarch64': [
                displayName: 'Linux ARM64',
                archiveName: "ffmpeg-${ffmpegBuildSeries}-latest-linuxarm64-lgpl-shared-8.1.tar.xz",
                format     : 'tar.xz'
        ],
        'linux-x86_64': [
                displayName: 'Linux AMD64',
                archiveName: "ffmpeg-${ffmpegBuildSeries}-latest-linux64-lgpl-shared-8.1.tar.xz",
                format     : 'tar.xz'
        ],
        'windows-aarch64': [
                displayName: 'Windows ARM64',
                archiveName: "ffmpeg-${ffmpegBuildSeries}-latest-winarm64-lgpl-shared-8.1.zip",
                format     : 'zip'
        ],
        'windows-x86_64': [
                displayName: 'Windows AMD64',
                archiveName: "ffmpeg-${ffmpegBuildSeries}-latest-win64-lgpl-shared-8.1.zip",
                format     : 'zip'
        ]
]
def selectedFfmpegBundle = embeddedFfmpegBundles[embeddedFfmpegPlatform]
def embeddedFfmpegResourceDirectory = layout.buildDirectory.dir(
        "generated/ffmpegResources/${embeddedFfmpegPlatform}")

def sha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[64 * 1024]
        for (int read = input.read(buffer); read >= 0; read = input.read(buffer)) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().encodeHex().toString()
}

def prepareEmbeddedFfmpegTask = selectedFfmpegBundle == null ? null :
        tasks.register('prepareEmbeddedFfmpeg') {
            def sourceArchive = layout.buildDirectory.file(
                    "downloads/ffmpeg/${embeddedFfmpegPlatform}/${selectedFfmpegBundle.archiveName}")
            def runtimeArchive = embeddedFfmpegResourceDirectory.map {
                it.file("META-INF/ffmpeg/${embeddedFfmpegPlatform}/ffmpeg.zip")
            }
            def bundleId = embeddedFfmpegResourceDirectory.map {
                it.file("META-INF/ffmpeg/${embeddedFfmpegPlatform}/bundle.id")
            }
            def license = embeddedFfmpegResourceDirectory.map {
                it.file("META-INF/licenses/FFmpeg-${embeddedFfmpegPlatform}-LGPL-3.0.txt")
            }
            def notice = embeddedFfmpegResourceDirectory.map {
                it.file("META-INF/third-party/ffmpeg-${embeddedFfmpegPlatform}.txt")
            }
            inputs.properties([
                    platform   : embeddedFfmpegPlatform,
                    archiveName: selectedFfmpegBundle.archiveName,
                    format     : selectedFfmpegBundle.format,
                    releaseApi : ffmpegReleaseApi
            ])
            outputs.files(runtimeArchive, bundleId, license, notice)
            outputs.upToDateWhen { false }

            doLast {
                def releaseConnection = new URI(ffmpegReleaseApi).toURL().openConnection()
                releaseConnection.connectTimeout = 30_000
                releaseConnection.readTimeout = 30_000
                releaseConnection.setRequestProperty('Accept', 'application/vnd.github+json')
                releaseConnection.setRequestProperty('User-Agent',
                        'VideoSynchronizer-Gradle-build')
                def release = releaseConnection.inputStream.withCloseable { input ->
                    new groovy.json.JsonSlurper().parse(input)
                }
                if (release.tag_name != ffmpegReleaseTag) {
                    throw new GradleException("Unexpected FFmpeg release tag: " +
                            release.tag_name)
                }
                def releaseAsset = release.assets.find { asset ->
                    asset.name == selectedFfmpegBundle.archiveName
                }
                if (releaseAsset == null) {
                    throw new GradleException("FFmpeg latest release does not contain " +
                            selectedFfmpegBundle.archiveName)
                }
                String assetDigest = releaseAsset.digest
                if (assetDigest == null ||
                        !(assetDigest ==~ /sha256:[0-9a-fA-F]{64}/)) {
                    throw new GradleException("FFmpeg release asset has no valid SHA-256 " +
                            "digest: ${selectedFfmpegBundle.archiveName}")
                }
                String expectedSha256 = assetDigest.substring('sha256:'.length())
                        .toLowerCase(Locale.ROOT)
                String downloadUrl = releaseAsset.browser_download_url
                URI downloadUri = new URI(downloadUrl)
                if (downloadUri.scheme != 'https' || downloadUri.host != 'github.com') {
                    throw new GradleException("Unexpected FFmpeg asset download URL: " +
                            downloadUrl)
                }

                File sourceFile = sourceArchive.get().asFile
                sourceFile.parentFile.mkdirs()
                if (!sourceFile.isFile() || sha256(sourceFile) != expectedSha256) {
                    File temporaryDownload = new File(sourceFile.parentFile,
                            sourceFile.name + '.part')
                    temporaryDownload.delete()
                    logger.lifecycle("Downloading FFmpeg LGPL shared build for " +
                            selectedFfmpegBundle.displayName)
                    def connection = downloadUri.toURL().openConnection()
                    connection.connectTimeout = 30_000
                    connection.readTimeout = 120_000
                    connection.setRequestProperty('User-Agent',
                            'VideoSynchronizer-Gradle-build')
                    connection.inputStream.withCloseable { input ->
                        temporaryDownload.withOutputStream { output ->
                            input.transferTo(output)
                        }
                    }
                    String actualSha256 = sha256(temporaryDownload)
                    if (actualSha256 != expectedSha256) {
                        temporaryDownload.delete()
                        throw new GradleException("FFmpeg archive SHA-256 mismatch: " +
                                actualSha256)
                    }
                    java.nio.file.Files.move(temporaryDownload.toPath(), sourceFile.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }

                File runtimeFile = runtimeArchive.get().asFile
                runtimeFile.parentFile.mkdirs()
                File temporaryRuntime = new File(runtimeFile.parentFile,
                        runtimeFile.name + '.part')
                temporaryRuntime.delete()
                Map<String, String> symbolicLinks = new TreeMap<>()
                Set<String> writtenEntries = new HashSet<>()

                def normalizedPath = { String rawName ->
                    String name = rawName.replace('\\', '/').replaceAll('^/+', '')
                    int rootSeparator = name.indexOf('/')
                    if (rootSeparator < 0 || rootSeparator == name.length() - 1) {
                        return null
                    }
                    String relative = name.substring(rootSeparator + 1)
                    java.nio.file.Path path = java.nio.file.Path.of(relative).normalize()
                    if (path.isAbsolute() || path.startsWith('..')) {
                        throw new GradleException("Unsafe FFmpeg archive entry: ${rawName}")
                    }
                    path.toString().replace('\\', '/')
                }
                def normalizedLinkTarget = { String linkPath, String rawTarget ->
                    java.nio.file.Path link = java.nio.file.Path.of(linkPath)
                    java.nio.file.Path parent = link.parent == null
                            ? java.nio.file.Path.of('') : link.parent
                    java.nio.file.Path target = parent.resolve(rawTarget).normalize()
                    if (target.isAbsolute() || target.startsWith('..')) {
                        throw new GradleException("Unsafe FFmpeg symbolic link: " +
                                "${linkPath} -> ${rawTarget}")
                    }
                    target.toString().replace('\\', '/')
                }

                temporaryRuntime.withOutputStream { fileOutput ->
                    new java.util.zip.ZipOutputStream(fileOutput).withCloseable { zipOutput ->
                        def writeEntry = { String path, InputStream input ->
                            if (path == null || !writtenEntries.add(path)) {
                                return
                            }
                            def entry = new java.util.zip.ZipEntry(path)
                            entry.time = 0L
                            zipOutput.putNextEntry(entry)
                            input.transferTo(zipOutput)
                            zipOutput.closeEntry()
                        }

                        if (selectedFfmpegBundle.format == 'zip') {
                            new java.util.zip.ZipInputStream(
                                    sourceFile.newInputStream()).withCloseable { zipInput ->
                                for (def entry = zipInput.nextEntry; entry != null;
                                     entry = zipInput.nextEntry) {
                                    if (!entry.directory) {
                                        writeEntry(normalizedPath(entry.name), zipInput)
                                    }
                                }
                            }
                        } else {
                            sourceFile.withInputStream { fileInput ->
                                def xzInput = new org.apache.commons.compress.compressors.xz.XZCompressorInputStream(fileInput)
                                new org.apache.commons.compress.archivers.tar.TarArchiveInputStream(xzInput).withCloseable { tarInput ->
                                    for (def entry = tarInput.getNextTarEntry(); entry != null;
                                         entry = tarInput.getNextTarEntry()) {
                                        String path = normalizedPath(entry.name)
                                        if (path == null || entry.isDirectory()) {
                                            continue
                                        }
                                        if (entry.isSymbolicLink() || entry.isLink()) {
                                            symbolicLinks[path] = normalizedLinkTarget(
                                                    path, entry.getLinkName())
                                        } else if (entry.isFile()) {
                                            writeEntry(path, tarInput)
                                        }
                                    }
                                }
                            }
                        }

                        if (!symbolicLinks.isEmpty()) {
                            List<String> manifestLines = symbolicLinks.collect { link, target ->
                                Set<String> visited = new HashSet<>()
                                String resolvedTarget = target
                                while (symbolicLinks.containsKey(resolvedTarget)) {
                                    if (!visited.add(resolvedTarget)) {
                                        throw new GradleException(
                                                "Cyclic FFmpeg symbolic link: ${link}")
                                    }
                                    resolvedTarget = symbolicLinks[resolvedTarget]
                                }
                                "${link}=${resolvedTarget}"
                            }
                            byte[] manifest = (manifestLines.join('\n') + '\n')
                                    .getBytes(java.nio.charset.StandardCharsets.UTF_8)
                            writeEntry('.video-synchronizer-links',
                                    new ByteArrayInputStream(manifest))
                        }
                    }
                }
                java.nio.file.Files.move(temporaryRuntime.toPath(), runtimeFile.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)

                File bundleIdFile = bundleId.get().asFile
                bundleIdFile.parentFile.mkdirs()
                bundleIdFile.setText("ffmpeg-${ffmpegBuildSeries}-" +
                        "${expectedSha256.substring(0, 16)}-lgpl-shared\n", 'UTF-8')

                File licenseFile = license.get().asFile
                licenseFile.parentFile.mkdirs()
                new java.util.zip.ZipFile(runtimeFile).withCloseable { zip ->
                    def licenseEntry = zip.entries().find { entry ->
                        !entry.directory && entry.name == 'LICENSE.txt'
                    }
                    if (licenseEntry == null) {
                        throw new GradleException('FFmpeg archive does not contain LICENSE.txt')
                    }
                    zip.getInputStream(licenseEntry).withCloseable { input ->
                        licenseFile.withOutputStream { output ->
                            input.transferTo(output)
                        }
                    }
                }

                File noticeFile = notice.get().asFile
                noticeFile.parentFile.mkdirs()
                noticeFile.setText("""FFmpeg ${selectedFfmpegBundle.displayName} distribution notice

VideoSynchronizer bundles an unmodified FFmpeg LGPL shared build produced by
BtbN/FFmpeg-Builds. The distribution is repackaged as ZIP without modifying its
individual files. Linux symbolic links are restored when the bundle is extracted.

Build: ${selectedFfmpegBundle.archiveName}, ${selectedFfmpegBundle.displayName}, LGPL shared
Release: https://github.com/BtbN/FFmpeg-Builds/releases/tag/${ffmpegReleaseTag}
Asset SHA-256: ${expectedSha256}
Build scripts: https://github.com/BtbN/FFmpeg-Builds/tree/master
FFmpeg source: https://github.com/FFmpeg/FFmpeg/tree/${ffmpegBuildSeries}
FFmpeg licensing: https://ffmpeg.org/legal.html

Repackaged distribution: META-INF/ffmpeg/${embeddedFfmpegPlatform}/ffmpeg.zip
LGPL v3 license: META-INF/licenses/FFmpeg-${embeddedFfmpegPlatform}-LGPL-3.0.txt

The video_synchronizer.ffmpeg JVM system property can bypass the bundled copy.
""", 'UTF-8')
            }
        }

if (prepareEmbeddedFfmpegTask != null) {
    sourceSets.main.resources.srcDir(embeddedFfmpegResourceDirectory)
}

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    if (prepareEmbeddedFfmpegTask != null) {
        dependsOn prepareEmbeddedFfmpegTask
    }

    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    if (embeddedFfmpegPlatformProperty.isPresent()) {
        archiveClassifier.set(embeddedFfmpegClassifiers[embeddedFfmpegPlatform])
    }
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
